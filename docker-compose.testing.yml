services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: papermaker_test
      POSTGRES_USER: papermaker
      POSTGRES_PASSWORD: ${PM_TEST_DB_PASSWORD:?Set a local-only test password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pm_testing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermaker -d papermaker_test"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pm_testing_data:
